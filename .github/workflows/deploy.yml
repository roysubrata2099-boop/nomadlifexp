- name: Check generated site
  run: |
    echo "========== INDEX =========="

    if test -f "_site/index.html"; then
      echo "FOUND: _site/index.html"
    else
      echo "ERROR: _site/index.html is missing"
      exit 1
    fi

    echo "========== REDIRECT =========="

    if test -f "_site/blog/posts/stop-procrastination/index.html"; then
      echo "FOUND: _site/blog/posts/stop-procrastination/index.html"
    else
      echo "ERROR: redirect is missing"
      find _site -type f | sort
      exit 1
    fi
