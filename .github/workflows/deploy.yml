- name: Check generated redirect
  run: |
    echo "==== REDIRECT FILE ===="
    if test -f _site/blog/posts/stop-procrastination/index.html; then
      echo "FOUND redirect page"
    else
      echo "MISSING redirect page"
      echo "==== SITE FILES ===="
      find _site -type f | sort | head -200
      exit 1
    fi
