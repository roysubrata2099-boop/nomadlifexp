- name: Inspect generated site
  run: |
    echo "=== BLOG FILES ==="
    find _site/blog -type f | sort || true

    echo ""
    echo "=== PROCRASTINATION FILES ==="
    find _site -iname '*procrastination*' -print | sort || true

    echo ""
    echo "=== JEKYLL CONFIG ==="
    bundle exec jekyll doctor --verbose || true

    echo ""
    echo "=== SITE ROOT ==="
    ls -la _site
