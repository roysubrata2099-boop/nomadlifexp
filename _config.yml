- name: Build Jekyll site
  run: bundle exec jekyll build --trace

- name: Verify generated site
  run: |
    echo "=== PROCRASTINATION ==="
    find _site -iname '*procrastination*' -print

    echo "=== BLOG ==="
    find _site/blog -type f | sort || true

    test -f "_site/blog/posts/stop-procrastination/index.html"

- name: Upload Pages artifact
  uses: actions/upload-pages-artifact@v3
  with:
    path: ./_site
